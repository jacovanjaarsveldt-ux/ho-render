name: render-long-sync
# Same as render-long.yml, except the join re-times the frames by frame number (setpts=N/30/TB, passthrough).
# Why: every chunk mp4 reports duration 47.552 s for 47.500 s of frames (B-frame start offset), so the concat copy leaves a 0.052 s gap at each join and the final encode duplicated frames to fill it:
# the picture then trailed the voice by 0.05 s per chunk boundary (about 0.57 s by the end of a 12-chunk long).
# Renders one long video as N frame-range chunks in parallel jobs (free on a public repo), then joins them, muxes videos/<video>/mix.wav and encodes.
on:
  workflow_dispatch:
    inputs:
      video: { description: "folder under videos/", required: true }
      entry: { description: "entry .tsx inside that folder", required: true }
      comp: { description: "composition id", required: true }
      chunks: { description: "number of parallel chunks", required: false, default: "8" }
      vbitrate: { description: "final video bitrate", required: false, default: "4000k" }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      frames: ${{ steps.m.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          node -e '
          const TL=require("./videos/${{ inputs.video }}/timeline.json"); const N=Number("${{ inputs.chunks }}");
          const total=Math.round(TL.end*30); const per=Math.ceil(total/N); const idx=[];
          for(let i=0;i<N;i++){const a=i*per,b=Math.min(total-1,(i+1)*per-1); if(a<=b) idx.push({i,a,b});}
          require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"matrix="+JSON.stringify({include:idx})+"\nframes="+total+"\n");'
  chunk:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npx remotion browser ensure
      - name: Render chunk
        run: |
          V=videos/${{ inputs.video }}
          npx remotion render $V/${{ inputs.entry }} ${{ inputs.comp }} out/c${{ matrix.i }}.mp4 --public-dir=$V/public --crf=18 --concurrency=$(nproc) --frames=${{ matrix.a }}-${{ matrix.b }} --log=info 2>&1 | grep -v "^Rendered\|^Encoded" || true
          test -s out/c${{ matrix.i }}.mp4
          ffprobe -v error -show_entries stream=nb_frames,width,height,r_frame_rate -of csv=p=0 out/c${{ matrix.i }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: out/c${{ matrix.i }}.mp4
          retention-days: 2
          compression-level: 0
  join:
    needs: [plan, chunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { pattern: "chunk-*", path: chunks }
      - name: Join, mux, encode
        run: |
          ls -la chunks/*
          for f in $(ls chunks/chunk-*/c*.mp4 | sort -V); do echo "file '$PWD/$f'"; done > list.txt
          cat list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy joined.mp4
          ffprobe -v error -show_entries stream=nb_frames -of csv=p=0 joined.mp4 | head -1
          echo "expected frames: ${{ needs.plan.outputs.frames }}"
          mkdir -p out; VB=${{ inputs.vbitrate }}
          ffmpeg -v error -y -i joined.mp4 -i videos/${{ inputs.video }}/mix.wav -map 0:v -map 1:a -vf setpts=N/30/TB -fps_mode passthrough -c:v libx264 -preset medium -b:v $VB -maxrate $(( ${VB%k} * 4 / 3 ))k -bufsize $(( ${VB%k} * 2 ))k -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 192k -ar 48000 -shortest out/${{ inputs.video }}-upload.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/${{ inputs.video }}-upload.mp4
          ffmpeg -nostats -i out/${{ inputs.video }}-upload.mp4 -af ebur128=peak=true -f null - 2>&1 | tail -12
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video }}
          path: out/${{ inputs.video }}-upload.mp4
          retention-days: 7
          compression-level: 0
